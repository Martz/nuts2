name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: palbot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: palbot/package-lock.json

      - run: npm ci
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: palbot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: palbot/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Unit tests with coverage
        run: npm run test:cov
      - name: E2E tests
        run: npm run test:e2e
      - name: Audit dependencies
        run: npm audit --audit-level=high
